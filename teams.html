<!DOCTYPE html>
<html>
<head>
  <title>Team Pages | The Dynasty League HQ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body style="background:#050505; color:white; font-family:Arial; padding:30px;">

  <h1>Franchise Pages</h1>
  <p>Click a team to open its franchise dashboard.</p>

  <div id="teams-grid" style="display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:18px;"></div>

  <p><a href="index.html" style="color:#e2c875;">Back to Dashboard</a></p>

  <script src="data.js"></script>

  <script>
    const grid = document.getElementById("teams-grid");

    teams.forEach(team => {
      grid.innerHTML += `
        <a href="team.html?id=${team.id}" style="text-decoration:none; color:white;">
          <div style="background:#151515; border:1px solid rgba(226,200,117,.25); border-radius:22px; padding:20px;">
            <img src="${team.logo}" style="width:100px; height:100px; object-fit:contain;">
            <h2>${team.name}</h2>
            <p style="color:#b8b0a0;">Owner: ${team.owner}</p>
            <p>Record: ${team.record}</p>
            <p>PF: ${team.pointsFor}</p>
          </div>
        </a>
      `;
    });
  </script>

</body>
</html>
