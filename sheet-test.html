<!DOCTYPE html>
<html>
<body style="background:#050505;color:white;font-family:Arial;padding:30px;">

<h1>Sheet Test</h1>
<pre id="output">Loading...</pre>

<script>
const sheetUrl =
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vRZp4lAXVZrcMa2y_dfi6h3xDjn4gqsFPlVCXFZA_RRLCthhqtDVca9CG8xmK1ZZQD3xxFinaZpqFip/pub?output=csv&gid=1040560069&range=B12:D14";

fetch(sheetUrl)
  .then(response => response.text())
  .then(data => {
    document.getElementById("output").textContent = data;
  })
  .catch(error => {
    document.getElementById("output").textContent = error;
  });
</script>

</body>
</html>
