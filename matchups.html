<!DOCTYPE html>
<html>
<head>
  <title>Matchups | Dynasty League HQ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * { box-sizing:border-box; }

    :root {
      --gold:#b38628;
      --light-gold:#e2c875;
      --muted:#b8b0a0;
      --border:rgba(226,200,117,.25);
      --white:#f8f5ed;
      --green:#22c55e;
      --red:#ef4444;
    }

    body {
      margin:0;
      font-family:Arial,sans-serif;
      color:var(--white);
      background:
        radial-gradient(circle at top right, rgba(179,134,40,.18), transparent 30%),
        radial-gradient(circle at top left, rgba(226,200,117,.10), transparent 35%),
        #050505;
    }

    a { color:inherit; text-decoration:none; }

    .app {
      display:grid;
      grid-template-columns:260px 1fr;
      min-height:100vh;
    }

    .sidebar {
      background:#090909;
      border-right:1px solid var(--border);
      padding:24px;
    }

    .league-logo {
      width:92px;
      height:92px;
      object-fit:contain;
      margin-bottom:14px;
    }

    .side-title {
      font-size:24px;
      line-height:1.05;
      font-weight:900;
      margin-bottom:6px;
    }

    .subtitle {
      color:var(--muted);
      font-size:13px;
      margin-bottom:26px;
    }

    .nav a {
      display:block;
      padding:12px 14px;
      border-radius:14px;
      margin-bottom:8px;
      color:#ddd6c8;
    }

    .nav .active,
    .nav a:hover {
      background:rgba(226,200,117,.14);
      color:white;
    }
        .main {
      padding:28px;
      max-width:1700px;
    }

    .hero {
      background:linear-gradient(135deg,rgba(20,20,20,.98),rgba(75,58,22,.94));
      border:1px solid var(--border);
      border-radius:28px;
      padding:30px;
      margin-bottom:20px;
    }

    .hero h1 {
      margin:0;
      font-size:44px;
    }

    .hero p {
      color:#fff4d6;
      margin:10px 0 0;
    }

    .filters {
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      margin-bottom:20px;
    }

    select {
      background:#111;
      color:white;
      border:1px solid var(--border);
      border-radius:14px;
      padding:10px 14px;
      font-size:14px;
    }

    .matchup-card {
      background:rgba(18,18,18,.96);
      border:1px solid var(--border);
      border-radius:24px;
      margin-bottom:16px;
      overflow:hidden;
    }

    .matchup-header {
      padding:20px;
      cursor:pointer;
    }

   .team-side {
  display:flex;
  align-items:center;
  gap:14px;
  min-width:0;
}

.team-side > div {
  width:100%;
}

.team-side.right {
  justify-content:flex-end;
  text-align:right;
}

.team-name {
  font-size:18px;
  font-weight:800;
}

    .team-logo {
      width:56px;
      height:56px;
      object-fit:contain;
    }

    .team-name {
      font-size:18px;
      font-weight:800;
    }

    .team-score {
      font-size:34px;
      font-weight:900;
      color:var(--light-gold);
    }

   .week-label {
  text-align:center;
  color:var(--light-gold);
  font-size:18px;
  font-weight:900;
  line-height:1.25;
}

.expand-text {
  display:block;
  margin-top:6px;
  color:var(--muted);
  font-size:12px;
  font-weight:500;
}
        .result-pill {
      display:inline-block;
      margin-top:6px;
      padding:5px 9px;
      border-radius:999px;
      font-size:12px;
      font-weight:bold;
    }

    .win { background:rgba(34,197,94,.18); color:var(--green); }
    .loss { background:rgba(239,68,68,.18); color:var(--red); }

    .lineup-wrap {
      display:none;
      border-top:1px solid rgba(226,200,117,.16);
      padding:18px;
      background:#090909;
    }

    .lineup-grid {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:18px;
    }

    .player-row {
  display:grid;
  grid-template-columns:52px 44px 1fr 70px;
      align-items:center;
      gap:10px;
      padding:9px 0;
      border-bottom:1px solid rgba(226,200,117,.12);
    }

    .slot-badge {
  background:rgba(226,200,117,.14);
  border:1px solid rgba(226,200,117,.35);
  color:var(--light-gold);
  border-radius:999px;
  padding:6px 8px;
  font-size:11px;
  font-weight:900;
  text-align:center;
}

    .player-img {
      width:38px;
      height:38px;
      border-radius:50%;
      object-fit:cover;
      background:#111;
    }

    .player-name {
      font-weight:bold;
    }

    .player-meta {
      color:var(--muted);
      font-size:11px;
    }

    .player-points {
  text-align:right;
  font-weight:900;
  font-variant-numeric:tabular-nums;
  color:var(--light-gold);
}

.lineup-title {
  font-size:18px;
  font-weight:800;
  margin-bottom:12px;
}

.scoreboard {
  display:grid;
  grid-template-columns:1fr 180px 1fr;
  gap:20px;
  align-items:center;
}

@media(max-width:900px) {
  .app { grid-template-columns:1fr; }
  .sidebar { border-right:none; border-bottom:1px solid var(--border); }
  .main { padding:18px; }
  .scoreboard {
  grid-template-columns:1fr 90px 1fr;
  gap:10px;
  text-align:center;
}
  .team-side {
  justify-content:flex-start;
  text-align:left;
}

.team-side.right {
  justify-content:flex-end;
  text-align:right;
}

.team-score {
  font-size:28px;
}

.week-label {
  margin:12px 0;
}
  .team-name {
  font-size:16px;
}

.team-score {
  font-size:24px;
}

.player-meta {
  font-size:10px;
}

.team-name {
  font-size:22px;
}
}

  </style>
</head>
<body>

<div class="app">

  <aside class="sidebar">
    <img class="league-logo" src="assets/logos/dynasty-league-logo.png.png">

    <div class="side-title">
      The Dynasty<br>League HQ
    </div>

    <div class="subtitle">
      Est. 2025 · Dynasty. Records. Lore.
    </div>

    <div class="nav">
      <a href="index.html">Dashboard</a>
      <a href="teams.html">Team Pages</a>
      <a href="standings.html">Standings</a>
      <a href="draft-history.html">Draft History</a>
      <a href="trade-history.html">Trade History</a>
      <a href="league-records.html">League Records</a>
      <a class="active" href="matchups.html">Matchups</a>
    </div>
  </aside>

  <main class="main">

    <section class="hero">
      <h1>Matchup History</h1>
      <p>Every game in league history with expandable Sleeper-style lineups.</p>
    </section>

    <div class="filters">
      <select id="teamFilter">
        <option value="ALL">All Teams</option>
      </select>

      <select id="seasonFilter">
        <option value="ALL">All Seasons</option>
      </select>
    </div>

    <div id="matchupsContainer"></div>

  </main>

</div>

<script src="data.js"></script>

<script>

const PUBLISHED_BASE =
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vRZp4lAXVZrcMa2y_dfi6h3xDjn4gqsFPlVCXFZA_RRLCthhqtDVca9CG8xmK1ZZQD3xxFinaZpqFip/pub?output=csv";

const gameDataGid = "159359987";
const startersGid = "132792542";
 const logosGid = "356018794"; 
function csvUrl(gid, range) {
  return `${PUBLISHED_BASE}&gid=${gid}&range=${range}`;
}

function parseCSV(text) {
  const rows = [];
  let row = [];
  let cell = "";
  let inQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const char = text[i];
    const next = text[i + 1];

    if (char === '"' && next === '"') {
      cell += '"';
      i++;
    } else if (char === '"') {
      inQuotes = !inQuotes;
    } else if (char === "," && !inQuotes) {
      row.push(cell.trim());
      cell = "";
    } else if ((char === "\n" || char === "\r") && !inQuotes) {
      if (cell || row.length) {
        row.push(cell.trim());
        rows.push(row);
        row = [];
        cell = "";
      }
    } else {
      cell += char;
    }
  }

  if (cell || row.length) {
    row.push(cell.trim());
    rows.push(row);
  }

  return rows;
}

async function getRange(gid, range) {
  const response = await fetch(csvUrl(gid, range));
  const text = await response.text();
  return parseCSV(text);
}

let games = [];
let starters = [];
function findTeamByOwnerId(ownerId) {
  return window.logoLookup?.[String(ownerId).trim()] || null;
}

function playerRowsForGame(season, week, ownerId, matchupId) {
  return starters
    .filter(row =>
      row[0] === season &&
      row[1] === week &&
      row[3] === ownerId &&
      row[4] === matchupId
    )
    .sort((a,b) => Number(a[5]) - Number(b[5]));
}

function lineupSlot(slotNumber) {
  const slots = {
    1: "QB",
    2: "RB",
    3: "RB",
    4: "WR",
    5: "WR",
    6: "TE",
    7: "FLX",
    8: "FLX",
    9: "SFLX"
  };

  return slots[Number(slotNumber)] || "BN";
}

  
function renderPlayerRows(rows) {
  if (!rows.length) {
    return `<div style="color:var(--muted);">No lineup data found.</div>`;
  }

  return rows.map(row => {
    const playerName = row[7];
    const position = row[8];
    const nflTeam = row[9];
    const slot = lineupSlot(row[5]);
    const points = row[10];
    const imageUrl = row[12];

    return `
      <div class="player-row">
  <div class="slot-badge">${slot}</div>
  ${imageUrl ? `<img class="player-img" src="${imageUrl}">` : `<div></div>`}

        <div>
          <div class="player-name">${playerName}</div>
          <div class="player-meta">${slot} · ${nflTeam}</div>
        </div>

        <div class="player-points">${points}</div>
      </div>
    `;
  }).join("");
}
async function loadMatchups() {
  const gameRows = await getRange(gameDataGid, "A:M");
  const starterRows = await getRange(startersGid, "A:N");
  const logoRows = await getRange(logosGid, "A:C");

window.logoLookup = {};

logoRows.slice(1).forEach(row => {
  const ownerName = row[0];
  const sleeperId = row[2];

  const matchingTeam = teams.find(team =>
    team.owner?.toLowerCase().trim() === ownerName?.toLowerCase().trim()
  );

 window.logoLookup[String(sleeperId).trim()] = {
  name: matchingTeam?.name || ownerName,
  owner: ownerName,
  logo: matchingTeam?.logo || ""
};
});

  const seenGames = new Set();

games = gameRows
  .slice(1)
  .filter(row => row[0] && row[12] === "Y")
  .filter(row => {
    const key = `${row[0]}-${row[1]}-${row[2]}`;

    if (seenGames.has(key)) return false;

    seenGames.add(key);
    return true;
  });

  starters = starterRows
    .slice(1)
    .filter(row => row[0]);

  buildFilters();
  renderMatchups();
}

function buildFilters() {
  const teamFilter = document.getElementById("teamFilter");
  const seasonFilter = document.getElementById("seasonFilter");

  Object.entries(window.logoLookup)
  .sort((a, b) => a[1].name.localeCompare(b[1].name))
  .forEach(([sleeperId, team]) => {
    teamFilter.innerHTML += `
      <option value="${sleeperId}">
        ${team.name}
      </option>
    `;
  });

  const seasons = [...new Set(games.map(row => row[0]))]
    .sort((a,b) => Number(b) - Number(a));

  seasons.forEach(season => {
    seasonFilter.innerHTML += `
      <option value="${season}">
        ${season}
      </option>
    `;
  });

  teamFilter.addEventListener("change", renderMatchups);
  seasonFilter.addEventListener("change", renderMatchups);
}
function renderMatchups() {
  const selectedTeam = document.getElementById("teamFilter").value;
  const selectedSeason = document.getElementById("seasonFilter").value;

  let filteredGames = games.filter(game => {
    const season = game[0];
    const ownerId = game[4];
    const opponentOwnerId = game[7];

    const seasonMatch =
      selectedSeason === "ALL" || season === selectedSeason;

    const teamMatch =
      selectedTeam === "ALL" ||
      ownerId === selectedTeam ||
      opponentOwnerId === selectedTeam;

    return seasonMatch && teamMatch;
  });

  filteredGames = filteredGames.sort((a,b) =>
  Number(a[0]) - Number(b[0]) ||
  Number(a[1]) - Number(b[1])
);

  document.getElementById("matchupsContainer").innerHTML =
    filteredGames.map(game => matchupCard(game)).join("");
}
function matchupCard(game) {
  const season = game[0];
  const week = game[1];
  const matchupId = game[2];

  const ownerId = game[4];
  const teamPoints = game[5];

  const opponentOwnerId = game[7];
  const opponentPoints = game[8];

  const result = game[9];
  const margin = game[10];

  const team = findTeamByOwnerId(ownerId);
  const opponent = findTeamByOwnerId(opponentOwnerId);

  const teamLineup =
    playerRowsForGame(season, week, ownerId, matchupId);

  const opponentLineup =
    playerRowsForGame(season, week, opponentOwnerId, matchupId);

  const cardId =
    `lineup-${season}-${week}-${matchupId}-${ownerId}`;

  return `
    <div class="matchup-card">

      <div class="matchup-header" onclick="toggleLineup('${cardId}')">
<div class="scoreboard">
  <div class="team-side">
    ${team?.logo ? `<img class="team-logo" src="${team.logo}">` : ""}
    <div>
      <div class="team-name">${team?.name || ownerId}</div>
      <div class="player-meta">${team?.owner || ""}</div>
      <div class="team-score">${Number(teamPoints).toFixed(2)}</div>
    </div>
  </div>

  <div class="week-label">
    <div>${season}</div>
    <div>Week ${week}</div>
    <span class="expand-text">Click to expand</span>
  </div>

  <div class="team-side right">
    <div>
      <div class="team-name">${opponent?.name || opponentOwnerId}</div>
      <div class="player-meta">${opponent?.owner || ""}</div>
      <div class="team-score">${Number(opponentPoints).toFixed(2)}</div>
    </div>
    ${opponent?.logo ? `<img class="team-logo" src="${opponent.logo}">` : ""}
  </div>
</div>

<div class="lineup-wrap" id="${cardId}">
        <div class="lineup-grid">
          <div>
           <div class="lineup-title">
  ${team?.name || ownerId}
</div>
            ${renderPlayerRows(teamLineup)}
          </div>

          <div>
            <div class="lineup-title">
  ${opponent?.name || opponentOwnerId}
</div>
            ${renderPlayerRows(opponentLineup)}
          </div>
        </div>
      </div>

    </div>
  `;
}
function toggleLineup(id) {
  const section = document.getElementById(id);

  section.style.display =
    section.style.display === "block" ? "none" : "block";
}

loadMatchups();

</script>
</body>
</html>
